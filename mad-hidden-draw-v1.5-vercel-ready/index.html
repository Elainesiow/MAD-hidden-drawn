<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAD VENTURE 2026 · First Move</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#fff;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}body{display:grid;place-items:center}.app{position:relative;width:min(100vw,430px);height:100dvh;max-height:932px;background:#05070d;overflow:hidden;box-shadow:0 0 80px #000}.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform:scale(1.025)}.scene.active{opacity:1;pointer-events:auto;transform:scale(1)}.scene img{width:100%;height:100%;object-fit:cover;display:block}.tap{position:absolute;inset:0;background:transparent;border:0}.enter{position:absolute;left:8%;right:8%;bottom:4.5%;height:12%;background:transparent;border:0}.selectWrap{position:absolute;left:12%;right:10%;top:39%;height:9%;z-index:3}.selectWrap select{width:100%;height:100%;appearance:none;background:#0c1220e8;color:white;border:1.5px solid #ff1b98;border-radius:10px;padding:0 16px;font-size:16px;font-weight:800;outline:none}.confirm{position:absolute;left:11%;right:10%;bottom:6%;height:10%;border:0;background:transparent}.verifyInput{position:absolute;left:19%;right:19%;top:55%;height:10%;display:flex;gap:8px;align-items:center}.verifyInput input{width:100%;height:100%;border:1.5px solid #8c54ff;border-radius:10px;background:#11162be8;color:#fff;text-align:center;font-size:24px;letter-spacing:14px;padding-left:14px;outline:none}.verifyBtn{position:absolute;left:13%;right:11%;bottom:16%;height:11%;border:0;background:transparent}.hold{position:absolute;left:18%;right:18%;bottom:8%;height:27%;border:0;background:transparent;touch-action:none}.progress{position:absolute;left:18%;right:18%;bottom:5.7%;height:1.3%;border-radius:999px;overflow:hidden;background:#1b1730}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff1b98,#ffd326,#00e8ff);transition:width .05s linear}.toast{position:absolute;left:50%;bottom:5%;transform:translateX(-50%) translateY(15px);padding:10px 14px;border:1px solid #ff2b9c;border-radius:10px;background:#070b15e8;font-size:12px;opacity:0;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:431px){.app{border-radius:28px;border:1px solid #202434}}
</style></head><body><main class="app" id="app"></main><script>
const app=document.getElementById('app'); let current=1;
function scene(n){const s=document.createElement('section');s.className='scene'+(n===1?' active':'');s.dataset.n=n;s.innerHTML=`<img src="assets/screen-${String(n).padStart(2,'0')}.webp" alt="">`;app.appendChild(s);return s}
for(let i=1;i<=10;i++)scene(i);
function go(n){document.querySelector('.scene.active')?.classList.remove('active');current=n;document.querySelector(`[data-n="${n}"]`).classList.add('active')}
const s1=document.querySelector('[data-n="1"]');const enter=document.createElement('button');enter.className='enter';enter.ariaLabel='Enter the experience';enter.onclick=()=>go(2);s1.appendChild(enter);
for(let n=2;n<=6;n++){const b=document.createElement('button');b.className='tap';b.ariaLabel='Continue';b.onclick=()=>go(n+1);document.querySelector(`[data-n="${n}"]`).appendChild(b)}
const s7=document.querySelector('[data-n="7"]');const sw=document.createElement('div');sw.className='selectWrap';const sel=document.createElement('select');for(let i=1;i<=50;i++){let o=document.createElement('option');o.value=i;o.textContent=`MAD ${String(i).padStart(2,'0')}`;sel.appendChild(o)}sw.appendChild(sel);s7.appendChild(sw);const cb=document.createElement('button');cb.className='confirm';cb.onclick=()=>go(8);s7.appendChild(cb);
const s8=document.querySelector('[data-n="8"]');const iw=document.createElement('div');iw.className='verifyInput';const inp=document.createElement('input');inp.type='password';inp.inputMode='numeric';inp.maxLength=4;inp.placeholder='••••';inp.addEventListener('input',()=>inp.value=inp.value.replace(/\D/g,'').slice(0,4));iw.appendChild(inp);s8.appendChild(iw);const vb=document.createElement('button');vb.className='verifyBtn';const toast=document.createElement('div');toast.className='toast';toast.textContent='Enter the leader’s last 4 IC digits · 请输入队长 IC 最后4位';s8.appendChild(toast);vb.onclick=()=>{if(inp.value.length!==4){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);return}go(9)};s8.appendChild(vb);
const s9=document.querySelector('[data-n="9"]');const hb=document.createElement('button');hb.className='hold';hb.ariaLabel='Hold to make your move';s9.appendChild(hb);const pr=document.createElement('div');pr.className='progress';pr.innerHTML='<i></i>';s9.appendChild(pr);let timer,start;function begin(e){e.preventDefault();start=performance.now();clearInterval(timer);timer=setInterval(()=>{let p=Math.min(1,(performance.now()-start)/2000);pr.firstChild.style.width=(p*100)+'%';if(p>=1){clearInterval(timer);if(navigator.vibrate)navigator.vibrate(60);setTimeout(()=>go(10),220)}},40)}function cancel(){clearInterval(timer);pr.firstChild.style.width='0%'}hb.addEventListener('pointerdown',begin);hb.addEventListener('pointerup',cancel);hb.addEventListener('pointercancel',cancel);hb.addEventListener('pointerleave',cancel);
</script></body></html>
